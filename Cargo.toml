[workspace]
members = [
    "crates/valerie-target",
    "crates/valerie-manifest",
    "crates/valerie-depgraph",
    "crates/valerie-driver",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "AGPL-3.0"
authors = ["Seuriin <seuriin@gmail.com>", "Iris-Seravelle <iris.seravelle@gmail.com>"]
repository = "https://github.com/Seuriin/valerie"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.dev]
opt-level = 0
debug = 1
strip = true
panic = "unwind"
lto = false
codegen-units = 64
incremental = true
