name: Release Valerie

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - i686-unknown-linux-musl
          - i686-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build release binary
        run: cross build --release --target ${{ matrix.target }} -p valerie-driver

      - name: Package artifact
        shell: bash
        run: |
          PKG_NAME="valerie-${GITHUB_REF_NAME}-${{ matrix.target }}"
          STAGING="dist/${PKG_NAME}"
          mkdir -p "${STAGING}/bin"

          # Copy compiled binary into bin/
          cp "target/${{ matrix.target }}/release/valerie" "${STAGING}/bin/"
          chmod +x "${STAGING}/bin/valerie"

          # Include licenses & readme
          [ -f "README.md" ] && cp "README.md" "${STAGING}/"
          [ -f "LICENSE" ] && cp "LICENSE" "${STAGING}/"

          # Create compressed tarball
          tar -czf "dist/${PKG_NAME}.tar.gz" -C "dist" "${PKG_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        working-directory: release-artifacts
        run: |
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/checksums.txt
          generate_release_notes: true
